# Development - MySQL
server.port=2798

#CONEXION CON MYSQL - DESARROLLO LOCAL
spring.datasource.url=jdbc:mysql://localhost:3306/ProtoCOB
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB para fotos
# MongoDB para fotos
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.gridfs.database=mongoBOB
spring.data.mongodb.auto-index-creation=true

# Mapeo de Entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Para desarrollo
spring.devtools.restart.enabled=true
logging.level.org.springframework.security=DEBUG

#Conex a PyBOB fastAPI
fastapi.url=

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10

# Spring Security
spring.security.filter.order=0

# Configuracion adicional opcional
spring.servlet.multipart.resolve-lazily=false

# Configuracion de Redis para desarrollo local
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# Tiempos de expiracion (en segundos)
app.redis.ttl.conversation=1800
app.redis.ttl.cache=86400
app.redis.ttl.rate-limit=60

# OLLAMA CONFIGURATION
ollama.api.url=
ollama.model=phi:2.7b-mini-q4_K_M
ollama.enabled=true
ollama.timeout=30000