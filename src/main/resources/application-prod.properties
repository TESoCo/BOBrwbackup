# ============================================
# CONFIGURACI\u00D3N DE REPOSITORIOS (\u00A1CR\u00CDTICO!)
# ============================================
# JPA es el repositorio PRINCIPAL
spring.data.jpa.repositories.enabled=true

# MongoDB SOLO para fotos (deshabilitar auto-detecci\u00F3n)
spring.data.mongodb.repositories.enabled=false

# Redis deshabilitado
spring.data.redis.repositories.enabled=false

# ============================================
# PRODUCTION MONGODB (SOLO PARA GRIDFS)
# ============================================
spring.data.mongodb.uri=${MONGO_URL}
spring.data.mongodb.database=railway
spring.data.mongodb.gridfs.database=${MONGO_DATABASE:railway}
spring.data.mongodb.auto-index-creation=true
# Deshabilitar transacciones para MongoDB standalone RAILWAY
spring.data.mongodb.transaction-enabled=false
# Additional MongoDB settings
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy



# ============================================
# PRODUCTION MYSQL (DATOS PRINCIPALES)
# ============================================
spring.datasource.url=jdbc:${MYSQL_URL}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Change to 'validate' later for production
spring.jpa.show-sql=false

# Configuracion adicional para PostgreSQL
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Para evitar problemas con sequences
spring.jpa.hibernate.use-new-id-generator-mappings=true


# Disable in production
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false


# Configuraci\u00F3n de Redis para Railway
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=5000ms
# Usar la URL completa si est\u00E1 disponible
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.shutdown-timeout=5000ms

# Production settings
spring.devtools.restart.enabled=false
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF

#Conexa  a PyBOB fastAPI
#railway
fastapi.url=${FASTAPI_URL}

# Especificar paquetes para cada tipo (opcional pero recomendado)
spring.data.jpa.repositories.base-package=com.example.dao
spring.data.mongodb.repositories.base-package=com.example.repository