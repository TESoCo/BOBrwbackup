<!DOCTYPE html>
<html lang="es" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Optimization Baseline - Crear Inventario</title>

    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/x-icon" th:href="@{/IMG/favicon.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/IMG/favicon.ico}">
    <!-- Para PNG (alta resolución) -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/IMG/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/IMG/favicon-16x16.png}">
    <!-- Apple Touch Icon (para iOS) -->
    <link rel="apple-touch-icon" th:href="@{/IMG/apple-touch-icon.png}">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" th:href="@{/CSS/dashboard.css}">
    <link rel="stylesheet" th:href="@{/CSS/INVENTARIO/crearInv.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
<button id="menu-toggle" class="menu-toggle">
    <i class="fas fa-bars"></i>
</button>
<div class="app-container" id="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img th:src="@{/IMG/imagen-cob.png}" alt="BOB Logo">
        </div>
        <ul class="nav-links">

            <!-- Dashboard - Para todos los usuarios autenticados -->
            <div sec:authorize="isAuthenticated()">
                <li><a th:href="@{/redirigir}"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
            </div>

            <!-- Gestión de Equipos -->
            <div sec:authorize="hasAnyAuthority('CREAR_EQUIPO', 'EDITAR_EQUIPO')">
                <li><a th:href="@{/equipos}"><i class="fas fa-users"></i> <span>Equipos</span></a></li>
            </div>

            <!-- Gestión de Proyectos -->
            <div sec:authorize="hasAnyAuthority('CREAR_PROYECTO', 'EDITAR_PROYECTO')">
                <li><a th:href="@{/proyectos}"><i class="fas fa-project-diagram"></i> <span>Proyectos</span></a></li>
            </div>

            <!-- Gestión de Usuarios - Solo con permisos de usuario -->
            <div sec:authorize="hasAnyAuthority('CREAR_USUARIO', 'EDITAR_USUARIO')">
                <li><a th:href="@{/usuarios}"><i class="fas fa-users-cog"></i> <span>Usuarios</span></a></li>
            </div>

            <div sec:authorize="hasAnyAuthority('CREAR_ROL', 'EDITAR_ROL', 'LEER_ROL')">
                <li><a th:href="@{/roles}"><i class="fas fa-user-shield"></i> <span>Roles</span></a></li>
            </div>

            <!-- Menu items for users with inventory permissions -->
            <!-- Inventario - Con permisos de inventario -->
            <div sec:authorize="hasAnyAuthority('CREAR_INVENTARIO', 'EDITAR_INVENTARIO')">
                <li><a th:href="@{/inventarios}"><i class="fas fa-box"></i> <span>Inventario</span></a></li>
            </div>

            <!-- Materiales - Con permisos de material -->
            <div sec:authorize="hasAnyAuthority('CREAR_MATERIAL', 'EDITAR_MATERIAL')">
                <li><a th:href="@{/material/inicioMaterial}"><i class="fas fa-calculator"></i> <span>Materiales</span></a></li>
            </div>

            <!-- APUs - Con permisos de APU -->
            <div sec:authorize="hasAnyAuthority('CREAR_APU', 'EDITAR_APU')">
                <li><a th:href="@{/apu/inicioAPU}"><i class="fas fa-calculator"></i> <span>Gestión de APUs</span></a></li>
            </div>

            <!-- Menu items for users with progress permissions -->
            <!-- Avances - Con permisos de avance -->
            <div sec:authorize="hasAnyAuthority('CREAR_AVANCE', 'EDITAR_AVANCE')">
                <li><a th:href="@{/avances/inicioAvances}"><i class="fas fa-hard-hat"></i> <span>Avances</span></a></li>
            </div>

            <!-- Menu items for users with budget permissions -->
            <!-- Obras - Con permisos de obra -->
            <div sec:authorize="hasAnyAuthority('CREAR_OBRA', 'EDITAR_OBRA', 'LEER_OBRA')">
                <li><a th:href="@{/obras/inicioObra}"><i class="fas fa-money-bill-wave"></i> <span>Obras</span></a></li>
            </div>

            <!-- Supervisor and Admin menu items -->
            <!-- Contratistas - Con permisos de contratista -->
            <div sec:authorize="hasAnyAuthority('CREAR_CONTRATISTA', 'EDITAR_CONTRATISTA')">
                <li><a th:href="@{/contratistas}"><i class="fas fa-handshake"></i> <span>Contratistas</span></a></li>
            </div>
            <!-- Proveedores - Con permisos de proveedor -->
            <div sec:authorize="hasAnyAuthority('CREAR_PROVEEDOR', 'EDITAR_PROVEEDOR')">
                <li><a href="/proveedores"><i class="fas fa-truck-loading"></i> <span>Proveedores</span></a></li>
            </div>


            <!-- Admin-only configuration -->
            <!-- Configuración - Solo ADMIN
            <div sec:authorize="hasRole('ADMIN')">
              <li><a href="#"><i class="fas fa-cog"></i> <span>Configuración</span></a></li>
            </div> -->

            <li>
                <form th:action="@{/logout}" method="post" id="logoutForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <a href="#" onclick="document.getElementById('logoutForm').submit()">
                        <i class="fas fa-sign-out-alt"></i> <span>Cerrar Sesión</span>
                    </a>
                </form>
            </li>
        </ul>
    </aside>

    <!-- Main content -->
    <main class="main-content">
        <div class="header">
            <h2>Crear Inventario</h2>
            <div class="user-menu">
                <div>
                    <div>
                        <a th:href="@{/perfil}" class="user-name-link">
                            <span sec:authentication="name"></span>
                        </a>
                    </div>
                    <div>
            <span class="role-badge">
                <span th:text="${#strings.replace(#authentication.principal.authorities[#authentication.principal.authorities.size()-1], 'ROLE_', '')}">Rol</span>
            </span>
                    </div>
                </div>
            </div>
        </div>

            <div class="form-container">

                <div class="form-content">
                    <form th:action="@{/inventarios/guardarInv}" method="post" th:object="${inventario}">
                        <input type="hidden" th:field="*{idUsuario.idUsuario}" />


                        <div class="form-group">
                            <label>Usuario Actual:</label>
                            <input type="text" th:value="${usuario.nombreUsuario}" readonly class="readonly-field">
                        </div>

                        <div class="form-group">
                            <label>Destino del material:</label>
                            <select id="tipoDestino" name="tipoDestino" class="form-select" onchange="toggleDestino()">
                                <option value="STOCK">Stock (Agregar material)</option>
                                <option value="OBRA">Obra (Consumir stock)</option>
                            </select>
                        </div>

                        <div class="form-group" id="obraGroup">
                            <label>Nombre Obra:</label>
                            <select th:field="*{idObra}" class="form-select">
                                <option value="">Seleccione una obra...</option>
                                <option th:each="obra : ${obras}"
                                        th:value="${obra.idObra}"
                                        th:text="${obra.nombreObra}"></option>
                            </select>
                            <span class="error-message" th:if="${#fields.hasErrors('idObra')}" th:errors="*{idObra}"></span>
                        </div>

                        <div class="form-group">
                            <label>Fecha:</label>
                            <input type="date" id="fecha" th:field="*{fechaIngreso}">
                        </div>

                        <div class="form-group">
                            <label>Observaciones o comentarios:</label>
                            <input type="text" th:field="*{comentarioInv}" required>
                        </div>

                        <!-- 📌 Materiales -->
                        <div class="materials-section">
                            <h3><i class='bx bx-list-plus'></i> Materiales</h3>
                            <div class="material-items" id="materialItems">
                                <div class="material-item" id="materialTemplate">
                                    <div class="form-group">
                                        <label>Material:</label>
                                        <select name="materialIds" class="material-select">
                                            <option value="">-- Seleccionar Material --</option>
                                            <option th:each="material : ${materiales}"
                                                    th:value="${material.idMaterial}"
                                                    th:text="${material.nombreMaterial}"
                                                    th:data-stock="${material.stockDisponible}"></option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Cantidad:</label>
                                        <input type="number" name="materialCantidades" class="material-quantity"
                                               placeholder="Ingrese cantidad" min="0" step="1.00">
                                    </div>
                                    <div class="form-group">
                                        <label>Stock actual:</label>
                                        <input type="number" class="stock-disponible" readonly
                                               placeholder="0.00" step="0.01">
                                    </div>
                                    <div class="form-group">
                                        <label>Stock después:</label>
                                        <input type="number" class="stock-despues" readonly
                                               placeholder="0.00" step="0.01">
                                    </div>
                                    <button type="button" class="btn-remove-material" onclick="removeMaterial(this)">
                                        <i class='bx bx-minus'></i> Eliminar
                                    </button>
                                </div>
                            </div>
                            <button type="button" class="btn-add-material" onclick="addMaterial()">
                                <i class='bx bx-plus'></i> Agregar otro material
                            </button>
                        </div>

                        <div class="submit-btn">
                            <input type="submit" value="Guardar">
                        </div>
                        <br>
                        <div>
                            <a th:href="@{/inventarios}" class="back-link">
                                <i class='bx bx-arrow-back'></i> Regresar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
    </main>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // --- Lógica de la Fecha ---
        let hoy = new Date();
        // Usa la hora local, no UTC
        let year = hoy.getFullYear();
        let month = String(hoy.getMonth() + 1).padStart(2, '0');
        let day = String(hoy.getDate()).padStart(2, '0');

        let fechaLocal = `${year}-${month}-${day}`;

        let inputFecha = document.getElementById("fecha");
        if (inputFecha) {
            inputFecha.value = fechaLocal; // valor por defecto = hoy
            inputFecha.min = fechaLocal;   // no deja fechas anteriores
            inputFecha.max = fechaLocal;   // no deja fechas posteriores
        }

        // --- Lógica del Menú Toggle ---
        const menuToggle = document.querySelector('.menu-toggle');
        const appContainer = document.querySelector('.app-container');
        const sidebar = document.querySelector('.sidebar'); // También lo necesitamos para cerrar al hacer clic fuera

        if (menuToggle && appContainer) {
            // El evento de clic en el botón de hamburguesa
            menuToggle.addEventListener('click', function() {
                appContainer.classList.toggle('sidebar-active');
            });

            // Opcional: Cerrar el menú al hacer clic fuera del sidebar (solo en móvil)
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 768 && appContainer.classList.contains('sidebar-active')) {
                    if (sidebar && !sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                        appContainer.classList.remove('sidebar-active');
                    }
                }
            });
        }
    });

    // ========== FUNCIONES PARA STOCK ==========

    // Función mejorada para agregar materiales
    function addMaterial() {
        const materialItems = document.getElementById('materialItems');
        const template = document.getElementById('materialTemplate');

        if (!materialItems || !template) {
            console.error('No se encontraron los elementos necesarios');
            return;
        }

        // Clonar el template
        const newMaterialItem = template.cloneNode(true);

        // Limpiar los valores
        const select = newMaterialItem.querySelector('.material-select');
        const quantityInput = newMaterialItem.querySelector('.material-quantity');
        const stockInput = newMaterialItem.querySelector('.stock-disponible');
        const stockDespuesInput = newMaterialItem.querySelector('.stock-despues');

        if (select) select.value = '';
        if (quantityInput) quantityInput.value = '';
        if (stockInput) stockInput.value = '0.00';
        if (stockDespuesInput) stockDespuesInput.value = '0.00';

        // Quitar el ID del template para que sea único
        newMaterialItem.removeAttribute('id');

        // Configurar eventos
        if (select) {
            select.onchange = function() { mostrarStock(this); };
        }
        if (quantityInput) {
            quantityInput.onchange = function() { validarStock(this); };
            quantityInput.oninput = function() { validarStock(this); };
        }

        // Aplicar el tipo de destino actual
        const tipoDestino = document.getElementById('tipoDestino').value;
        if (quantityInput) {
            quantityInput.dataset.validarStock = tipoDestino === 'STOCK' ? 'false' : 'true';
        }

        // Agregar el nuevo elemento
        materialItems.appendChild(newMaterialItem);

        // Mostrar el botón de eliminar si hay más de un material
        updateRemoveButtons();
    }

    // Función mejorada para eliminar materiales
    function removeMaterial(button) {
        const materialItems = document.getElementById('materialItems');
        const parentItem = button.closest('.material-item');

        if (!materialItems || !parentItem) return;

        // No eliminar si solo queda un material
        if (materialItems.children.length <= 1) {
            alert('Debe haber al menos un material en la lista');
            return;
        }

        parentItem.remove();
        updateRemoveButtons();
    }

    // Función para actualizar la visibilidad de los botones de eliminar
    function updateRemoveButtons() {
        const materialItems = document.getElementById('materialItems');
        const removeButtons = document.querySelectorAll('.btn-remove-material');

        if (materialItems.children.length <= 1) {
            // Ocultar el botón de eliminar si solo hay un material
            removeButtons.forEach(btn => btn.style.display = 'none');
        } else {
            // Mostrar todos los botones de eliminar
            removeButtons.forEach(btn => btn.style.display = 'inline-block');
        }
    }

    // Función mejorada para mostrar stock
    function mostrarStock(select) {
        const item = select.closest('.material-item');
        if (!item) return;

        const stock = parseFloat(select.options[select.selectedIndex]?.dataset?.stock || 0);
        const stockInput = item.querySelector('.stock-disponible');
        if (stockInput) {
            stockInput.value = stock.toFixed(2);
        }
        calcularStockDespues(item);
    }

    // Función mejorada para validar stock
    function validarStock(input) {
        const item = input.closest('.material-item');
        if (!item) return true;

        const tipoDestino = document.getElementById('tipoDestino').value;

        // Si es STOCK, no validar
        if (tipoDestino === 'STOCK') {
            calcularStockDespues(item);
            return true;
        }

        const select = item.querySelector('.material-select');
        if (!select) return true;

        const stock = parseFloat(select.options[select.selectedIndex]?.dataset?.stock || 0);
        const cantidad = parseFloat(input.value) || 0;

        if (cantidad > stock && stock > 0) {
            alert(`⚠️ Stock insuficiente.\nDisponible: ${stock.toFixed(2)}\nSolicitado: ${cantidad.toFixed(2)}`);
            input.value = '';
            calcularStockDespues(item);
            return false;
        }

        calcularStockDespues(item);
        return true;
    }

    // Función mejorada para calcular stock después
    function calcularStockDespues(item) {
        if (!item) return;

        const tipoDestino = document.getElementById('tipoDestino').value;
        const select = item.querySelector('.material-select');
        const cantidadInput = item.querySelector('.material-quantity');
        const stockDespuesInput = item.querySelector('.stock-despues');

        if (!select || !cantidadInput || !stockDespuesInput) return;

        const stock = parseFloat(select.options[select.selectedIndex]?.dataset?.stock || 0);
        const cantidad = parseFloat(cantidadInput.value) || 0;

        let stockDespues;
        if (tipoDestino === 'STOCK') {
            stockDespues = stock + cantidad; // Agregar al stock
        } else {
            stockDespues = stock - cantidad; // Consumir del stock
        }

        stockDespuesInput.value = stockDespues.toFixed(2);
    }

    // Función mejorada para toggle destino
    function toggleDestino() {
        const tipoDestino = document.getElementById('tipoDestino').value;
        const obraGroup = document.getElementById('obraGroup');
        const materialQuantities = document.querySelectorAll('.material-quantity');

        if (tipoDestino === 'STOCK') {
            // Ocultar selección de obra
            if (obraGroup) {
                obraGroup.style.display = 'none';
            }

            // No validar stock para consumo (cuando se agrega al stock)
            materialQuantities.forEach(input => {
                input.dataset.validarStock = 'false';
            });

            // Actualizar etiquetas
            const sectionTitle = document.querySelector('.materials-section h3');
            if (sectionTitle) {
                sectionTitle.innerHTML = '<i class="bx bx-plus-circle"></i> Agregar materiales al stock';
            }

        } else {
            // Mostrar selección de obra
            if (obraGroup) {
                obraGroup.style.display = 'block';
            }

            // Activar validación de stock para consumo
            materialQuantities.forEach(input => {
                input.dataset.validarStock = 'true';
            });

            // Actualizar etiquetas
            const sectionTitle = document.querySelector('.materials-section h3');
            if (sectionTitle) {
                sectionTitle.innerHTML = '<i class="bx bx-list-plus"></i> Materiales para obra';
            }
        }

        // Recalcular stock después para todos los materiales
        document.querySelectorAll('.material-item').forEach(item => {
            calcularStockDespues(item);
        });

        // Actualizar botones de eliminar
        updateRemoveButtons();
    }

    // Inicializar al cargar
    document.addEventListener("DOMContentLoaded", function() {
        // ... (mantener el código existente de fecha y menú)

        // Inicializar la sección de materiales
        toggleDestino();
        updateRemoveButtons();

        // Configurar eventos iniciales
        document.querySelectorAll('.material-select').forEach(select => {
            select.onchange = function() { mostrarStock(this); };
        });

        document.querySelectorAll('.material-quantity').forEach(input => {
            input.onchange = function() { validarStock(this); };
            input.oninput = function() { validarStock(this); };
        });
    });

</script>

</body>
</html>
