<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Estadísticas de Inventario</title>
</head>
<body>
<div class="container">
    <h1>Estadísticas de Inventario</h1>

    <div class="row">
        <div class="col-md-3">
            <div class="card">
                <div class="card-body text-center">
                    <h2 th:text="${totalInventarios}">0</h2>
                    <p>Total Inventarios</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body text-center">
                    <h2 th:text="${inventariosPendientes}">0</h2>
                    <p>Pendientes</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body text-center">
                    <h2 th:text="${inventariosActivos}">0</h2>
                    <p>Activos</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body text-center">
                    <h2 th:text="${totalInventarios - inventariosActivos}">0</h2>
                    <p>Finalizados</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Inventarios por Estado</h4>
                </div>
                <div class="card-body">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Estado</th>
                            <th>Cantidad</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="entry : ${conteoPorEstado}">
                            <td th:text="${entry.key.displayName}"></td>
                            <td th:text="${entry.value}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
