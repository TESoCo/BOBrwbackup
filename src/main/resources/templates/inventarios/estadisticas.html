<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Estadísticas de Solicitud</title>
</head>
<body>
<div class="container">
    <h1>Estadísticas de Solicitud</h1>

    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/x-icon" th:href="@{/IMG/favicon.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/IMG/favicon.ico}">
    <!-- Para PNG (alta resolución) -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/IMG/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/IMG/favicon-16x16.png}">
    <!-- Apple Touch Icon (para iOS) -->
    <link rel="apple-touch-icon" th:href="@{/IMG/apple-touch-icon.png}">

    <!-- ===== CSS ===== -->

    <div class="row">
        <div class="col-md-3">
            <div class="card">
                <div class="card-body text-center">
                    <h2 th:text="${totalInventarios}">0</h2>
                    <p>Total Solicitudes</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body text-center">
                    <h2 th:text="${inventariosPendientes}">0</h2>
                    <p>Pendientes</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body text-center">
                    <h2 th:text="${inventariosActivos}">0</h2>
                    <p>Activas</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body text-center">
                    <h2 th:text="${totalInventarios - inventariosActivos}">0</h2>
                    <p>Finalizadas</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Solicitudes por Estado</h4>
                </div>
                <div class="card-body">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Estado</th>
                            <th>Cantidad</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="entry : ${conteoPorEstado}">
                            <td th:text="${entry.key.displayName}"></td>
                            <td th:text="${entry.value}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
