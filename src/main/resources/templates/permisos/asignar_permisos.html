<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Asignar Permisos</title>

  <!-- ===== FAVICON ===== -->
  <link rel="icon" type="image/x-icon" th:href="@{/IMG/favicon.ico}">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/IMG/favicon.ico}">
  <!-- Para PNG (alta resolución) -->
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/IMG/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/IMG/favicon-16x16.png}">
  <!-- Apple Touch Icon (para iOS) -->
  <link rel="apple-touch-icon" th:href="@{/IMG/apple-touch-icon.png}">

  <!-- ===== CSS ===== -->
</head>
<body>

<h2 th:text="'Asignar permisos a ' + ${rol.descripcion_perfil}"></h2>

<form th:action="@{'/roles/' + ${rol.id_perfil} + '/permisos'}" method="post">
  <ul>
    <li th:each="permiso : ${todosPermisos}">
      <input type="checkbox"
             name="permisosIds"
             th:value="${permiso.id}"
             th:checked="${rol.permisos.contains(permiso)}"/>
      <span th:text="${permiso.nombre}"></span>
    </li>
  </ul>
  <button type="submit">Guardar permisos</button>
</form>

</body>
</html>
