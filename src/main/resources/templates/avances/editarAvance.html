<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión de Materiales - Construction Optimization Baseline</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/CSS/dashboard.css}">
        <link rel="stylesheet" th:href="@{/CSS/AVANCES/editarAvance.css}">
    </head>
    <body>
        <button id="menu-toggle" class="menu-toggle">
            <i class="fas fa-bars"></i>
        </button>
        <div class="app-container" id="app-container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <img th:src="@{/IMG/imagen-cob.png}" alt="BOB Logo">
                </div>
                <ul class="nav-links">

                    <!-- Dashboard - Para todos los usuarios autenticados -->
                    <div sec:authorize="isAuthenticated()">
                        <li><a th:href="@{/redirigir}"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
                    </div>

                    <!-- Gestión de Equipos -->
                    <div sec:authorize="hasAnyAuthority('CREAR_EQUIPO', 'EDITAR_EQUIPO')">
                        <li><a th:href="@{/equipos}"><i class="fas fa-users"></i> <span>Equipos</span></a></li>
                    </div>

                    <!-- Gestión de Proyectos -->
                    <div sec:authorize="hasAnyAuthority('CREAR_PROYECTO', 'EDITAR_PROYECTO')">
                        <li><a th:href="@{/proyectos}"><i class="fas fa-project-diagram"></i> <span>Proyectos</span></a></li>
                    </div>

                    <!-- Gestión de Usuarios - Solo con permisos de usuario -->
                    <div sec:authorize="hasAnyAuthority('CREAR_USUARIO', 'EDITAR_USUARIO')">
                        <li><a th:href="@{/usuarios}"><i class="fas fa-users-cog"></i> <span>Usuarios</span></a></li>
                    </div>

                    <div sec:authorize="hasAnyAuthority('CREAR_ROL', 'EDITAR_ROL', 'LEER_ROL')">
                        <li><a th:href="@{/roles}"><i class="fas fa-user-shield"></i> <span>Roles</span></a></li>
                    </div>

                    <!-- Menu items for users with inventory permissions -->
                    <!-- Inventario - Con permisos de inventario -->
                    <div sec:authorize="hasAnyAuthority('CREAR_INVENTARIO', 'EDITAR_INVENTARIO')">
                        <li><a th:href="@{/inventarios}"><i class="fas fa-box"></i> <span>Inventario</span></a></li>
                    </div>

                    <!-- Materiales - Con permisos de material -->
                    <div sec:authorize="hasAnyAuthority('CREAR_MATERIAL', 'EDITAR_MATERIAL')">
                        <li><a th:href="@{/material/inicioMaterial}"><i class="fas fa-calculator"></i> <span>Materiales</span></a></li>
                    </div>

                    <!-- APUs - Con permisos de APU -->
                    <div sec:authorize="hasAnyAuthority('CREAR_APU', 'EDITAR_APU')">
                        <li><a th:href="@{/apu/inicioAPU}"><i class="fas fa-calculator"></i> <span>Gestión de APUs</span></a></li>
                    </div>

                    <!-- Menu items for users with progress permissions -->
                    <!-- Avances - Con permisos de avance -->
                    <div sec:authorize="hasAnyAuthority('CREAR_AVANCE', 'EDITAR_AVANCE')">
                        <li><a th:href="@{/avances/inicioAvances}"><i class="fas fa-hard-hat"></i> <span>Avances</span></a></li>
                    </div>

                    <!-- Menu items for users with budget permissions -->
                    <!-- Obras - Con permisos de obra -->
                    <div sec:authorize="hasAnyAuthority('CREAR_OBRA', 'EDITAR_OBRA', 'LEER_OBRA')">
                        <li><a th:href="@{/obras/inicioObra}"><i class="fas fa-money-bill-wave"></i> <span>Obras</span></a></li>
                    </div>

                    <!-- Supervisor and Admin menu items -->
                    <!-- Contratistas - Con permisos de contratista -->
                    <div sec:authorize="hasAnyAuthority('CREAR_CONTRATISTA', 'EDITAR_CONTRATISTA')">
                        <li><a th:href="@{/contratistas}"><i class="fas fa-handshake"></i> <span>Contratistas</span></a></li>
                    </div>
                    <!-- Proveedores - Con permisos de proveedor -->
                    <div sec:authorize="hasAnyAuthority('CREAR_PROVEEDOR', 'EDITAR_PROVEEDOR')">
                        <li><a href="/proveedores"><i class="fas fa-truck-loading"></i> <span>Proveedores</span></a></li>
                    </div>


                    <!-- Admin-only configuration -->
                    <!-- Configuración - Solo ADMIN
                    <div sec:authorize="hasRole('ADMIN')">
                      <li><a href="#"><i class="fas fa-cog"></i> <span>Configuración</span></a></li>
                    </div> -->

                    <li>
                        <form th:action="@{/logout}" method="post" id="logoutForm">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <a href="#" onclick="document.getElementById('logoutForm').submit()">
                                <i class="fas fa-sign-out-alt"></i> <span>Cerrar Sesión</span>
                            </a>
                        </form>
                    </li>
                </ul>
            </aside>

            <!-- Main content -->
            <main class="main-content">
                <!-- Header -->
                <div class="header">
                    <div>
                        <h2>Editar un Avance de Obra</h2>
                    </div>
                    <div class="user-menu">
                        <div>
                            <div>
                                <a th:href="@{/perfil}" class="user-name-link">
                                    <span sec:authentication="name"></span>
                                </a>
                            </div>
                            <div>
                    <span class="role-badge">
                        <span th:text="${#strings.replace(#authentication.principal.authorities[#authentication.principal.authorities.size()-1], 'ROLE_', '')}">Rol</span>
                    </span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Back button -->
                <div class="mb-3">
                    <a th:href="@{/avances/inicioAvances}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Regresar
                    </a>
                </div>

                <br>

                <!-- Edit Form -->
                <div class="form-container">
                    <form th:action="@{/avances/actualizar}" method="post" th:object="${avance}">
                        <input type="hidden" name="idAvance" th:value="${avance.idAvance}">

                        <!-- Work Name Input -->
                        <div class="form-group">
                            <label for="obraDropdown"><b>Nombre de la obra:</b></label>
                            <select id="obraDropdown" name="idObra" class="form-control" required>
                                <option value="">Seleccione...</option>
                                <option th:each="pre : ${obras}"
                                        th:value="${pre.idObra}"
                                        th:selected="${pre.idObra == avance.idObra}"
                                        th:text="${pre.nombreObra}">
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fecha"><b>Fecha:</b></label>
                            <input type="date" name="fecha" id="fecha" class="form-control"
                                   th:value="${avance.fechaAvance}" required>
                        </div>

                        <div class="form-group">
                            <label for="activityDropdown"><b>Actividad:</b></label>
                            <select id="activityDropdown" name="idAPU" class="form-control" required>
                                <option value="">Seleccione...</option>
                                <option th:each="apu : ${apus}"
                                        th:value="${apu.idAPU}"
                                        th:selected="${apu.idAPU == avance.idApu}"
                                        th:text="${apu.nombreAPU} + ' (' + apu.unidadesAPU + ')'">
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="cantidad"><b>Cantidad:</b></label>
                            <input type="number" id="cantidad" name="cantidad" step="0.01" min="0.01"
                                   th:value="${avance.cantEjec}" class="form-control" required>
                        </div>

                        <!-- Hidden inputs that will be submitted -->
                        <input type="hidden" name="idUsuario" th:value="${avance != null ? avance.idUsuario.idUsuario : ''}">

                        <!-- Submit Button -->
                        <div class="submit-btn" id="submitButton">
                            <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">
                                <i class="fas fa-save"></i> Actualizar Avance
                            </button>
                        </div>

                    </form>
                </div>
            </main>
        </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // --- 1. Lógica de Control del Menú Móvil ---
            const menuToggle = document.getElementById('menu-toggle');
            const appContainer = document.getElementById('app-container');
            const sidebar = document.querySelector('.sidebar');
            const menuIcon = menuToggle ? menuToggle.querySelector('i') : null;

            if (menuToggle && appContainer && sidebar && menuIcon) {
                // Alternar la clase y el ícono al hacer clic
                menuToggle.addEventListener('click', function() {
                    appContainer.classList.toggle('sidebar-active');

                    // Cambiar el ícono (fa-bars <-> fa-times)
                    if (appContainer.classList.contains('sidebar-active')) {
                        menuIcon.classList.remove('fa-bars');
                        menuIcon.classList.add('fa-times'); // Ícono de cerrar
                    } else {
                        menuIcon.classList.remove('fa-times');
                        menuIcon.classList.add('fa-bars'); // Ícono de menú
                    }
                });

                // Cerrar el menú al hacer clic fuera (solo en móvil)
                document.addEventListener('click', (e) => {
                    if (window.innerWidth <= 768 && appContainer.classList.contains('sidebar-active')) {
                        if (!sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                            appContainer.classList.remove('sidebar-active');
                            menuIcon.classList.remove('fa-times');
                            menuIcon.classList.add('fa-bars');
                        }
                    }
                });
            }
        });


    </script>
    </body>
</html>
