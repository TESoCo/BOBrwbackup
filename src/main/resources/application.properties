#OTROS

# Spring Security
spring.security.filter.order=0

# Shared settings
spring.jpa.show-sql=true

# Configuracion adicional opcional
spring.servlet.multipart.resolve-lazily=false


# Microsoft OAuth2
microsoft.client.id=${MICROSOFT_CLIENT_ID}
microsoft.client.secret=${MICROSOFT_CLIENT_SECRET}
microsoft.redirect.uri=${MICROSOFT_REDIRECT_URI}


# ============================================
# CONFIGURACI\u00D3N DE REPOSITORIOS
# ============================================
# JPA es el repositorio principal
spring.data.jpa.repositories.enabled=true

# MongoDB solo para fotos (deshabilitar repositorios autom\u00E1ticos)
spring.data.mongodb.repositories.enabled=false

# Redis deshabilitado en producci\u00F3n?
spring.data.redis.repositories.enabled=true







