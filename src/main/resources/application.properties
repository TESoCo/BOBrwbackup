spring.application.name=COB

# Activate dev profile by default, Render will override to prod
spring.profiles.active=dev

#server.port=2798
spring.main.banner-mode=off

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

#Importar archivos csv y fotos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

#Conex a PyBOB fastAPI
fastapi.url=${FASTAPI_URL}


# APIs - CON VARIABLES DE ENTORNO#################################################################
deepseek.api.key=${DEEPSEEK_API_KEY}
deepseek.api.model=deepseek-chat
deepseek.api.url=https://api.deepseek.com/v1/chat/completions

openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.api.model=google/gemini-2.0-flash-exp:free

gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash:generateContent?key=TU_API_KEY

# ============================================
# CONFIGURACI\u00D3N SMTP (con OAuth2)
# ============================================
# Email Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.auth.mechanisms=XOAUTH2
spring.mail.properties.mail.smtp.sasl.enable=true
spring.mail.properties.mail.smtp.sasl.mechanisms=XOAUTH2


#spring.mail.username=${GMAIL_USERNAME}---- ahora est\u00E1 en la secci\u00F3n de OAuth2
#spring.mail.password=${GMAIL_APP_PASSWORD}


# ============================================
# CONFIGURACIN OAUTH2 PARA GMAIL
# ============================================

# Credenciales de Google Cloud Console
google.oauth.client.id=${GOOGLE_CLIENT_ID}
google.oauth.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URI}
# Nombre de la aplicacin
google.oauth.application.name=COB


# Email remitente (debe ser el mismo que autoriz\u00F3 OAuth2)
# Para usuarios con Google, se usa su propio email
# Para el sistema, usamos una cuenta espec\u00EDfica
spring.mail.username=${GMAIL_USERNAME}


# Directorio donde se almacenarn las credenciales OAuth2
google.oauth.credentials.folder=./oauth-credentials


# ============================================
# OAuth2 del Sistema (para usuarios locales)
# Usado por EmailService con XOAUTH2
# ============================================
spring.mail.oauth2.system.client-id=${GOOGLE_CLIENT_ID}
spring.mail.oauth2.system.client-secret=${GOOGLE_CLIENT_SECRET}
spring.mail.oauth2.system.refresh-token=${SYSTEM_OAUTH2_REFRESH_TOKEN}
spring.mail.oauth2.system.username=${GMAIL_SYSTEM_USERNAME}
spring.mail.oauth2.system.application-name=COB-System



# ============================================
# LOGGING PARA DEPURACIN
# ============================================

logging.level.com.example.servicioWeb.OAuth2EmailService=DEBUG
logging.level.com.google.api.client=DEBUG


